; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = 
	BOARD_CUSTOM

[env]
framework = arduino
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
platform_packages = 
	platformio/framework-arduinoespressif32@https://github.com/espressif/arduino-esp32.git#3.1.1
	platformio/framework-arduinoespressif32-libs@https://dl.espressif.com/AE/esp-arduino-libs/esp32-3.1.1-h.zip
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = 
	https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#v1.1.0
	https://github.com/esp-arduino-libs/esp-lib-utils.git#v0.2.0
	https://github.com/lvgl/lvgl.git#v8.4.0
	file://./libs/ESP32_Display_Panel
	gyverlibs/EncButton@^3.7.2
	gyverlibs/GyverTimer @ ^3.2
	https://github.com/collin80/esp32_can.git
	https://github.com/collin80/can_common
    yourapiexpert/ATCommands@^0.0.1

[common]
build_flags = 
	-DCORE_DEBUG_LEVEL=1
	-DLV_CONF_INCLUDE_SIMPLE
	-DLV_LVGL_H_INCLUDE_SIMPLE
	-I src
	
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1

[spi_qspi_lcd]
build_flags = 
	-DLV_COLOR_16_SWAP=1

[rgb_mipi_lcd]
build_flags = 
	-DLV_COLOR_16_SWAP=0

[env:BOARD_CUSTOM]
build_flags = 
	${common.build_flags}
	${rgb_mipi_lcd.build_flags}
	-DBOARD_ESPRESSIF_ESP32_P4_FUNCTION_EV_BOARD
	-DBOARD_HAS_PSRAM
	-DLV_CONF_INCLUDE_SIMPLE
	-I.
	-DCONFIG_PPA_ENABLE=1
	-DCONFIG_LVGL_PORT_ENABLE_PPA=1
	-DCONFIG_LCD_RESTART_IN_VSYNC=1
	-DCONFIG_SPIRAM_SPEED_200M=1
	-DCONFIG_SPIRAM_MODE_OCT=1
board = BOARD_CUSTOM
board_build.f_flash = 80000000L

[env:BOARD_ESPRESSIF_ESP32_C3_LCDKIT]
build_flags = 
	${common.build_flags}
	${spi_qspi_lcd.build_flags}
	-DESP_PANEL_BOARD_DEFAULT_USE_SUPPORTED=1
	-DBOARD_ESPRESSIF_ESP32_C3_LCDKIT
board = BOARD_ESPRESSIF_ESP32_C3_LCDKIT

